stages:
  - init
  - plan
  - apply
  - destroy   

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  TF_LOG: "DEBUG"
  TF_LOG_PATH: "debug.log"
before_script:
  - echo "public_key = \"${PUBLIC_KEY}\"" >> $DEV_TFVARS
  - echo "=== Contents of $DEV_TFVARS ==="
  - cat $DEV_TFVARS
  - echo "=== Terraform Version ==="
  - terraform --version
  - echo "=== AWS CLI Version ==="
  - aws --version
  - aws sts get-caller-identity
  - echo "=== Current Directory Contents ==="
  - ls -al

init:
  stage: init
  tags:
    - terraform
  script:
    - echo "=== Running terraform init ==="
    - terraform init -upgrade 
    - echo "=== Terraform Providers Lock ==="
    - cat .terraform.lock.hcl
    - echo "=== .terraform Directory Contents ==="
    - ls -la .terraform/
  artifacts:
    paths:
      - .terraform/
      - .terraform.lock.hcl
      - debug.log 

plan:
  stage: plan
  tags:
    - terraform
  dependencies:
    - init
  script:
    - echo "=== Running terraform validate ==="
    - terraform validate 
    - echo "=== Running terraform plan ==="
    - terraform plan -var-file=$DEV_TFVARS -out=tfplan -input=false 
    - echo "=== Plan File Summary ==="

  artifacts:
    paths:
      - tfplan
      - debug.log

apply:
  stage: apply
  tags:
    - terraform
  dependencies:
    - init
    - plan
  when: manual
  script:
    - terraform apply -auto-approve tfplan
    - terraform show
  artifacts:
    paths:
      - debug.log
      - tfplan

destroy:
  stage: destroy
  tags:
    - terraform
  dependencies:
    - init
  when: manual         
  script:
    - terraform destroy -var-file=$DEV_TFVARS -auto-approve
  artifacts:
    paths:
      - debug.log


